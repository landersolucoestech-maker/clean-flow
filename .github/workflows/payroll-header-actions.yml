name: Payroll Header Actions

on:
  push:
    branches: [dev]
    paths:
      - ".github/payroll-header-actions.trigger"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Move payroll actions to route header
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/web/src/modules/payroll/pages/PayrollPage.tsx')
          s = p.read_text()
          old = '''return <PageLayout>\n      <div className="space-y-4">\n          {/* Payroll actions */}\n          <div className="flex flex-wrap justify-end gap-2">\n              <Button variant="outline" onClick={() => setRulesModalOpen(true)} className="gap-2">\n                <Settings className="w-4 h-4" />\n                {t("payroll.payrollRules")}\n              </Button>\n              <Button onClick={handleOpenCalculateModal} className="gap-2">\n                <Calculator className="w-4 h-4" />\n                {t("payroll.calculatePayroll")}\n              </Button>\n              <Button variant="outline" onClick={handleDownloadExcel} className="gap-2">\n                <Download className="w-4 h-4" />\n                {t("payroll.downloadExcel")}\n              </Button>\n              <Button \n                onClick={handleBulkSendPDFViaSMS} \n                variant="default"\n                className="gap-2"\n                disabled={selectedRows.length === 0 || isSendingBulkSMS}\n              >\n                {isSendingBulkSMS ? (\n                  <>\n                    <Loader2 className="w-4 h-4 animate-spin" />\n                    Sending {bulkSMSProgress.sent}/{bulkSMSProgress.total}\n                  </>\n                ) : (\n                  <>\n                    <Send className="w-4 h-4" />\n                    Send PDFs ({selectedRows.length})\n                  </>\n                )}\n              </Button>\n          </div>\n'''
          new = '''return <PageLayout\n      headerActions={\n        <>\n          <Button size="sm" variant="outline" onClick={() => setRulesModalOpen(true)} className="gap-2">\n            <Settings className="h-4 w-4" />\n            {t("payroll.payrollRules")}\n          </Button>\n          <Button size="sm" onClick={handleOpenCalculateModal} className="gap-2">\n            <Calculator className="h-4 w-4" />\n            {t("payroll.calculatePayroll")}\n          </Button>\n          <Button size="sm" variant="outline" onClick={handleDownloadExcel} className="gap-2">\n            <Download className="h-4 w-4" />\n            {t("payroll.downloadExcel")}\n          </Button>\n          <Button\n            size="sm"\n            onClick={handleBulkSendPDFViaSMS}\n            className="gap-2"\n            disabled={selectedRows.length === 0 || isSendingBulkSMS}\n          >\n            {isSendingBulkSMS ? (\n              <>\n                <Loader2 className="h-4 w-4 animate-spin" />\n                Sending {bulkSMSProgress.sent}/{bulkSMSProgress.total}\n              </>\n            ) : (\n              <>\n                <Send className="h-4 w-4" />\n                Send PDFs ({selectedRows.length})\n              </>\n            )}\n          </Button>\n        </>\n      }\n    >\n      <div className="space-y-4">\n'''
          if old not in s:
              raise SystemExit('Expected payroll action block not found')
          p.write_text(s.replace(old, new, 1))
      - run: npm ci
      - run: npx eslint apps/web/src/modules/payroll/pages/PayrollPage.tsx --max-warnings=0
      - run: npm run typecheck
      - run: npm run build
      - name: Commit validated change
        run: |
          rm -f .github/payroll-header-actions.trigger .github/workflows/payroll-header-actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/payroll/pages/PayrollPage.tsx .github
          git commit -m "fix(payroll): move actions into page header"
          git push origin HEAD:dev
