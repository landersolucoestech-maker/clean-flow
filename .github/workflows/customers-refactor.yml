name: Customers refactor

on:
  push:
    branches: [DEV]
    paths:
      - .github/workflows/customers-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refine customers shell and responsive layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/modules/customers/CustomersPage.tsx')
          text = path.read_text(encoding='utf-8')

          def once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old[:140]}')
              text = text.replace(old, new, 1)

          once('import { Header } from "@/components/layout/Header";\nimport { Sidebar } from "@/components/layout/Sidebar";',
               'import { PageLayout } from "@/components/layout/PageLayout";')

          once('''    return (\n      <div className="flex h-screen bg-background">\n        <Sidebar />\n        <div className="flex-1 flex flex-col overflow-hidden">\n          <Header />\n          <main className="flex-1 flex items-center justify-center">\n            <Loader2 className="w-8 h-8 animate-spin text-primary" />\n          </main>\n        </div>\n      </div>\n    );''',
               '''    return (\n      <PageLayout>\n        <div className="flex min-h-[50vh] items-center justify-center">\n          <Loader2 className="h-8 w-8 animate-spin text-primary" />\n        </div>\n      </PageLayout>\n    );''')

          once('''  return <div className="flex h-screen bg-background">\n      <Sidebar />\n      \n      <div className="flex-1 flex flex-col overflow-hidden">\n        <Header />\n        \n        <main className="flex-1 overflow-y-auto p-6 space-y-6">''',
               '''  return <PageLayout>\n      <div className="space-y-6">''')
          once('''        </main>\n      </div>\n    </div>;''',
               '''      </div>\n    </PageLayout>;''')

          once('className="flex items-center justify-between"',
               'className="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between"')
          once('className="text-3xl font-bold text-foreground"',
               'className="text-2xl font-bold tracking-tight text-foreground sm:text-3xl"')
          once('className="flex items-center gap-2"',
               'className="flex flex-wrap items-center gap-2 lg:justify-end"')
          once('variant="hero" size="lg" className="flex items-center space-x-2"',
               'variant="hero" className="flex items-center gap-2"')

          once('className="grid grid-cols-1 md:grid-cols-5 gap-4"',
               'className="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-5"')
          text = text.replace('className="p-2 bg-success/10 rounded-lg"', 'className="flex h-10 w-10 items-center justify-center rounded-full bg-success/10"')
          text = text.replace('className="p-2 bg-primary/10 rounded-lg"', 'className="flex h-10 w-10 items-center justify-center rounded-full bg-primary-light"')
          text = text.replace('className="p-2 bg-destructive/10 rounded-lg"', 'className="flex h-10 w-10 items-center justify-center rounded-full bg-destructive/10"')
          text = text.replace('className="p-2 bg-secondary/50 rounded-lg"', 'className="flex h-10 w-10 items-center justify-center rounded-full bg-secondary-light"')
          text = text.replace('className="p-2 bg-warning/10 rounded-lg"', 'className="flex h-10 w-10 items-center justify-center rounded-full bg-warning/10"')

          once('className="flex items-center gap-4"',
               'className="flex flex-col gap-3 rounded-2xl border border-border/80 bg-card p-4 shadow-sm lg:flex-row lg:items-center"')
          once('className="w-[160px] bg-background border-border"',
               'className="w-full lg:w-[160px]"')
          once('className="w-[140px] bg-background border-border"',
               'className="w-full lg:w-[140px]"')
          once('className="pl-10 bg-background border-border"',
               'className="pl-10"')

          once('<Card>\n            <CardHeader className="flex flex-row items-center justify-between">',
               '<Card className="border-border/80 shadow-sm">\n            <CardHeader className="flex flex-row items-center justify-between gap-3 pb-4">')
          text = text.replace('className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"',
                              'className="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3"')
          text = text.replace('className="relative"', 'className="relative border-border/80 shadow-sm transition-shadow hover:shadow-md"')
          text = text.replace('className="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center"',
                              'className="flex h-10 w-10 items-center justify-center rounded-full bg-primary-light"')
          text = text.replace('className="flex items-center justify-between mt-4 pt-3 border-t border-border"',
                              'className="mt-4 flex items-center justify-between border-t border-border/80 pt-3"')

          path.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified customers refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/customers/CustomersPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style: modernize customers page shell and layout"
          git push origin HEAD:DEV
