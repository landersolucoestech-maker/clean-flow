name: Maid Flow Frontend Preview

on:
  push:
    branches: [dev]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - ".github/workflows/frontend-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: maid-flow-pages-preview-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure Pages uses workflow publishing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build current dev frontend
        run: npm run build -- --base /clean-flow/

      - name: Add SPA fallback and build marker
        run: |
          cp dist/index.html dist/404.html
          printf '%s\n' "$GITHUB_SHA" > dist/maid-flow-version.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy current dev build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
