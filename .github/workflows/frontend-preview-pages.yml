name: Maid Flow Frontend Preview

on:
  push:
    branches: [dev]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - ".github/workflows/frontend-preview-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: maid-flow-pages-preview-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate frontend
        run: npm run check

      - name: Build GitHub Pages preview
        run: npm run build -- --base /clean-flow/

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Confirm GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
