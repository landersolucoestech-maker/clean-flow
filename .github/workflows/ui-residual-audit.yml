name: Residual UI audit

on:
  push:
    branches: [DEV]
    paths:
      - .github/workflows/ui-residual-audit.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV
      - name: Audit remaining UI inconsistencies
        run: |
          echo '=== MODULE FILES WITH HEADER/SIDEBAR IMPORTS ==='
          grep -RIl --include='*.tsx' -E '@/components/layout/(Header|Sidebar)' apps/web/src/modules || true
          echo '=== ARBITRARY LEGACY SPACING ==='
          grep -RIn --include='*.tsx' -E 'pl-\[10px\]|pr-\[10px\]|mx-\[8px\]|pt-px|my-\[4px\]' apps/web/src/modules || true
          echo '=== HARDCODED PALETTE CLASSES ==='
          grep -RIn --include='*.tsx' -E '(bg|text|border|fill)-(blue|green|red|yellow|orange|purple|cyan|indigo|emerald|gray)-[0-9]{2,3}' apps/web/src/modules | head -250 || true
          echo '=== RIGID FIVE COLUMN GRIDS ==='
          grep -RIn --include='*.tsx' -E 'md:grid-cols-5|grid-cols-5' apps/web/src/modules || true
          echo '=== PAGE TITLES STILL LEGACY ==='
          grep -RIn --include='*.tsx' 'text-3xl font-bold text-foreground' apps/web/src/modules || true
