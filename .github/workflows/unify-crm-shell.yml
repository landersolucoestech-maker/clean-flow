name: Unify CRM Shell

on:
  push:
    branches: [dev]
    paths:
      - ".github/scripts/unify_crm_shell.py"
      - ".github/workflows/unify-crm-shell.yml"

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply unified CRM shell
        run: python3 .github/scripts/unify_crm_shell.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npx vitest run apps/web/src
      - name: Build
        run: npm run build
      - name: Commit validated CRM shell
        run: |
          rm .github/scripts/unify_crm_shell.py
          rm .github/workflows/unify-crm-shell.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/crm/customers/pages/CustomersPage.tsx \
                  apps/web/src/modules/crm/customers/pages/CustomersPageContent.tsx \
                  apps/web/src/modules/crm/contacts/pages/ContactsPage.tsx \
                  .github/scripts/unify_crm_shell.py \
                  .github/workflows/unify-crm-shell.yml
          git commit -m "refactor crm into one unified shell"
          git pull --rebase origin dev
          git push origin HEAD:dev
