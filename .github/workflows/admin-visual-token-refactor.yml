name: Admin visual token refactor

on:
  push:
    branches: [DEV]
    paths:
      - .github/workflows/admin-visual-token-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Harmonize admin portal with semantic tokens
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('apps/web/src/modules/admin')
          files = [p for p in root.rglob('*.tsx') if p.name != 'AdminAuth.tsx']
          mapping = {
            'bg-gray-50': 'bg-background',
            'bg-gray-100': 'bg-muted',
            'bg-gray-200': 'bg-muted',
            'bg-white': 'bg-card',
            'border-gray-100': 'border-border/60',
            'border-gray-200': 'border-border/80',
            'border-gray-300': 'border-border',
            'text-gray-900': 'text-foreground',
            'text-gray-800': 'text-foreground',
            'text-gray-700': 'text-foreground',
            'text-gray-600': 'text-muted-foreground',
            'text-gray-500': 'text-muted-foreground',
            'text-gray-400': 'text-muted-foreground/70',
            'hover:bg-gray-50': 'hover:bg-accent/40',
            'hover:bg-gray-100': 'hover:bg-accent',
            'hover:text-gray-900': 'hover:text-foreground',
            'hover:text-gray-700': 'hover:text-foreground',
            'hover:text-gray-600': 'hover:text-foreground',
            'bg-orange-500': 'bg-primary',
            'bg-orange-600': 'bg-primary-dark',
            'text-orange-600': 'text-primary',
            'text-orange-500': 'text-primary',
            'bg-red-100': 'bg-destructive/10',
            'text-red-700': 'text-destructive',
            'text-red-600': 'text-destructive',
            'bg-red-500': 'bg-destructive',
            'bg-red-600': 'bg-destructive/90',
            'bg-green-100': 'bg-success/10',
            'text-green-700': 'text-success',
            'text-green-600': 'text-success',
            'bg-green-500': 'bg-success',
            'bg-blue-100': 'bg-primary-light',
            'text-blue-700': 'text-primary-dark',
            'text-blue-600': 'text-primary',
            'bg-orange-100': 'bg-warning/10',
            'text-orange-700': 'text-warning-foreground',
          }
          changed = 0
          for p in files:
              text = p.read_text(encoding='utf-8')
              before = text
              for old, new in mapping.items():
                  text = text.replace(old, new)
              if text != before:
                  p.write_text(text, encoding='utf-8')
                  changed += 1
                  print(f'updated {p}')
          print(f'admin files updated: {changed}')
          PY
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified admin refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/admin
          git diff --cached --quiet && exit 0
          git commit -m "style: align admin portal with semantic design tokens"
          git push origin HEAD:DEV
