name: CRM Professional Finish

on:
  push:
    branches: [dev]
    paths:
      - ".github/crm-professional.trigger"

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize CRM tab anatomy
        shell: python
        run: |
          from pathlib import Path

          leads_path = Path("apps/web/src/modules/crm/leads/pages/LeadsPageContent.tsx")
          leads = leads_path.read_text()
          leads = leads.replace(
              '    <PageLayout>\n      <div className="space-y-3">',
              '    <PageLayout\n      headerActions={\n        <Button size="sm" onClick={() => setCreateModalOpen(true)}>\n          <Plus className="mr-2 h-4 w-4" />\n          <span>{t("leads.newLead")}</span>\n        </Button>\n      }\n    >\n      <div className="space-y-3">',
              1,
          )
          leads = leads.replace(
              '                <Button variant="hero" size="sm" className="flex items-center gap-2" onClick={() => setCreateModalOpen(true)}>\n                  <Plus className="h-4 w-4" />\n                  <span>{t("leads.newLead")}</span>\n                </Button>\n',
              '',
              1,
          )
          leads_path.write_text(leads)

          contacts_path = Path("apps/web/src/modules/crm/contacts/pages/ContactsPage.tsx")
          contacts = contacts_path.read_text()
          contacts = contacts.replace(
              '      <PageLayout>\n      <div className="space-y-3">',
              '      <PageLayout\n        headerActions={mayCreate ? <Button size="sm" onClick={openCreate}><Plus className="mr-2 h-4 w-4" />Create Contact</Button> : undefined}\n      >\n      <div className="space-y-3">',
              1,
          )
          contacts = contacts.replace(
              '              {mayCreate && <Button size="sm" onClick={openCreate}><Plus className="mr-2 h-4 w-4" />Create Contact</Button>}\n',
              '',
              1,
          )
          contacts = contacts.replace(
              '            <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">',
              '            <Card className="overflow-hidden">\n            <div className="flex flex-col gap-3 border-b border-border px-4 py-3 sm:flex-row sm:items-center sm:justify-between">',
              1,
          )
          contacts = contacts.replace(
              '            </div>\n\n            <Card className="overflow-hidden">\n              <CardContent className="border-b border-border bg-muted/20 p-3">',
              '            </div>\n\n              <CardContent className="border-b border-border bg-muted/20 p-3">',
              1,
          )
          contacts = contacts.replace(
              '              </CardContent>\n            </Card>\n\n            {error && (',
              '              </CardContent>\n\n            {error && (',
              1,
          )
          contacts = contacts.replace(
              '            <Card className="overflow-hidden">\n              <CardContent className="p-0">',
              '              <CardContent className="p-0">',
              1,
          )
          contacts_path.write_text(contacts)

      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint apps/web/src packages --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npx vitest run apps/web/src
      - name: Build
        run: npm run build

      - name: Commit validated CRM finish and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/crm-professional.trigger .github/workflows/crm-professional-finish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src .github
          git commit -m "refactor(crm): unify professional tab workspace" || exit 0
          git push origin HEAD:dev
