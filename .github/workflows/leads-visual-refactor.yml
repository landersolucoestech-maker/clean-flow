name: Leads visual refactor

on:
  push:
    branches: [DEV]
    paths:
      - .github/workflows/leads-visual-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refine leads shell and responsive presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/web/src/modules/leads/LeadsPage.tsx')
          text = p.read_text(encoding='utf-8')

          def rep(old, new, count=1):
              global text
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old[:140]}')
              text = text.replace(old, new, count)

          rep('import { Header } from "@/components/layout/Header";\nimport { Sidebar } from "@/components/layout/Sidebar";', 'import { PageLayout } from "@/components/layout/PageLayout";')

          rep('''  return (\n    <div className="flex h-screen bg-background">\n      <Sidebar />\n      \n      <div className="flex-1 flex flex-col overflow-hidden">\n        <Header />\n        \n        <main className="flex-1 overflow-y-auto p-6 space-y-6">''', '''  return (\n    <PageLayout>\n      <div className="space-y-6">''')

          rep('''          <div className="flex items-center justify-between">''', '''          <div className="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">''')
          rep('''              <h1 className="text-3xl font-bold text-foreground">{t("leads.title")}</h1>''', '''              <h1 className="text-2xl font-bold tracking-tight text-foreground sm:text-3xl">{t("leads.title")}</h1>''')
          rep('''              variant="hero" \n              size="lg" \n              className="flex items-center space-x-2"''', '''              variant="hero" \n              className="flex items-center gap-2"''')

          rep('''          <div className="grid grid-cols-2 md:grid-cols-5 gap-3">''', '''          <div className="grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-5">''')
          rep('''                  "cursor-pointer transition-all hover:shadow-md",''', '''                  "cursor-pointer border-border/80 shadow-sm transition-all hover:-translate-y-0.5 hover:shadow-md",''')
          rep('''                <CardContent className="p-3">''', '''                <CardContent className="p-4">''')
          rep('''                    <div className={cn("w-3 h-3 rounded-full", status.color)} />''', '''                    <div className={cn("h-3 w-3 rounded-full ring-4 ring-background", status.color)} />''')

          rep('''          <div className="flex items-center gap-4 flex-wrap">''', '''          <div className="flex flex-col gap-3 rounded-2xl border border-border/80 bg-card p-4 shadow-sm lg:flex-row lg:flex-wrap lg:items-center">''')
          rep('''            <div className="relative flex-1 min-w-[200px] max-w-md">''', '''            <div className="relative min-w-0 flex-1 lg:min-w-[240px]">''')
          rep('''              <SelectTrigger className="w-[180px]">''', '''              <SelectTrigger className="w-full lg:w-[180px]">''', 2)

          rep('''          <Card>\n            <CardContent className="p-0">''', '''          <Card className="overflow-hidden border-border/80 shadow-sm">\n            <CardContent className="p-0">''')
          rep('''                          <TableRow key={estimate.id} className="hover:bg-muted/50">''', '''                          <TableRow key={estimate.id}>''')

          rep('''className="bg-emerald-50 text-emerald-700 border-emerald-200 text-xs"''', '''className="border-success/30 bg-success/10 text-xs text-success"''')
          rep('''className="bg-amber-50 text-amber-700 border-amber-200 text-xs"''', '''className="border-warning/30 bg-warning/10 text-xs text-warning-foreground"''')
          rep('''className="bg-blue-50 text-blue-700 border-blue-200 text-xs"''', '''className="border-primary/30 bg-primary-light text-xs text-primary-dark"''')
          rep('''className="bg-orange-50 text-orange-700 border-orange-200 text-xs"''', '''className="border-warning/30 bg-warning/10 text-xs text-warning-foreground"''')
          rep('''<CheckCircle className="w-4 h-4 mr-2 text-green-500" />''', '''<CheckCircle className="mr-2 h-4 w-4 text-success" />''')
          rep('''<XCircle className="w-4 h-4 mr-2 text-red-500" />''', '''<XCircle className="mr-2 h-4 w-4 text-destructive" />''')

          rep('''          </Card>\n        </main>\n      </div>\n\n      {/* Modals */}''', '''          </Card>\n      </div>\n\n      {/* Modals */}''')
          rep('''      />\n    </div>\n  );\n}''', '''      />\n    </PageLayout>\n  );\n}''')

          p.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified leads refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/leads/LeadsPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style: modernize leads page shell and layout"
          git push origin HEAD:DEV
