name: Responsive grid cleanup

on:
  push:
    branches: [DEV]
    paths:
      - .github/workflows/responsive-grid-cleanup.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Make residual rigid grids responsive
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'apps/web/src/modules/billing/components/EditInvoiceModal.tsx': [
              ('grid grid-cols-5 gap-3', 'grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-5'),
            ],
            'apps/web/src/modules/leads/components/CreateLeadModal.tsx': [
              ('grid grid-cols-5 gap-3', 'grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-5'),
              ('space-y-2 col-span-2', 'space-y-2 sm:col-span-2 lg:col-span-2'),
            ],
            'apps/web/src/modules/leads/components/EditLeadModal.tsx': [
              ('grid grid-cols-5 gap-3', 'grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-5'),
              ('space-y-2 col-span-2', 'space-y-2 sm:col-span-2 lg:col-span-2'),
            ],
            'apps/web/src/modules/settings/components/AutomationsTab.tsx': [
              ('grid grid-cols-2 md:grid-cols-5 gap-4', 'grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-5'),
            ],
          }

          for file, reps in replacements.items():
              p = Path(file)
              text = p.read_text(encoding='utf-8')
              for old, new in reps:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {file}: {old}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
              print(f'updated {file}')
          PY
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified responsive cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/billing/components/EditInvoiceModal.tsx apps/web/src/modules/leads/components/CreateLeadModal.tsx apps/web/src/modules/leads/components/EditLeadModal.tsx apps/web/src/modules/settings/components/AutomationsTab.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style: make residual module grids responsive"
          git push origin HEAD:DEV
