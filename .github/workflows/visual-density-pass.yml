name: Visual Density Pass

on:
  push:
    branches: [dev]
    paths:
      - ".github/visual-density.trigger"

permissions:
  contents: write

jobs:
  visual-density:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply density normalization
        run: |
          python scripts/visual_density_pass.py
          python scripts/crm_visual_cleanup.py
          python scripts/visual_hotspot_cleanup.py
          python scripts/visual_final_hotspots.py
          python scripts/auth_visual_cleanup.py
      - name: Audit remaining visual-density hotspots
        run: python scripts/visual_quality_audit.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint apps/web/src packages --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npx vitest run apps/web/src
      - name: Build
        run: npm run build
      - name: Commit validated visual pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src
          git commit -m "refactor(ui): finish professional interface cleanup" || true
          git pull --rebase origin dev
          git push origin HEAD:dev
