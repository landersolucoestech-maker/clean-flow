name: Visual Density Pass

on:
  push:
    branches: [dev]
    paths:
      - ".github/visual-density.trigger"

permissions:
  contents: write

jobs:
  visual-density:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply density normalization
        run: python scripts/visual_density_pass.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint apps/web/src packages --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npx vitest run apps/web/src
      - name: Build
        run: npm run build
      - name: Commit validated visual pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/modules/transactions/pages/TransactionsPage.tsx \
            apps/web/src/modules/schedule/pages/SchedulePage.tsx \
            apps/web/src/modules/communications/pages/CommunicationsPage.tsx \
            apps/web/src/modules/payroll/pages/PayrollPage.tsx \
            apps/web/src/modules/billing/pages/BillingPage.tsx
          git commit -m "refactor(ui): normalize operational page density" || true
          git pull --rebase origin dev
          git push origin HEAD:dev
