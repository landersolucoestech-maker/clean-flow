name: Transactions visual refactor

on:
  push:
    branches: [DEV]
    paths:
      - .github/workflows/transactions-visual-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refine transactions responsive presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/web/src/modules/transactions/TransactionsPage.tsx')
          text = p.read_text(encoding='utf-8')

          def once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old[:140]}')
              text = text.replace(old, new, 1)

          once('className="grid grid-cols-1 md:grid-cols-5 gap-4"',
               'className="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-5"')
          text = text.replace('className="bg-card border-border"', 'className="border-border/80 shadow-sm"')
          text = text.replace('className="text-2xl font-bold text-green-500"', 'className="text-2xl font-bold tracking-tight text-success"')
          text = text.replace('className="text-2xl font-bold text-red-500"', 'className="text-2xl font-bold tracking-tight text-destructive"')
          text = text.replace('className="text-2xl font-bold text-blue-500"', 'className="text-2xl font-bold tracking-tight text-primary-dark"')
          text = text.replace('className="text-xs text-green-500"', 'className="text-xs font-medium text-success"')

          once('className="flex flex-wrap gap-4 items-center"',
               'className="flex flex-col gap-3 rounded-2xl border border-border/80 bg-card p-4 shadow-sm lg:flex-row lg:flex-wrap lg:items-center"')
          once('className="relative w-[300px]"',
               'className="relative w-full min-w-0 flex-1 lg:max-w-[360px]"')
          once('className="pl-10 bg-muted/30"', 'className="pl-10"')
          text = text.replace('className="w-[140px] justify-start text-left font-normal"',
                              'className="w-full justify-start text-left font-normal sm:w-[150px]"')
          text = text.replace('className="w-[140px]"', 'className="w-full sm:w-[140px]"')
          text = text.replace('className="w-[160px]"', 'className="w-full sm:w-[160px]"')

          once('<Card>\n        <CardContent className="p-0">',
               '<Card className="overflow-hidden border-border/80 shadow-sm">\n        <CardContent className="overflow-x-auto p-0">')
          once('className="flex items-center gap-4 px-6 py-3 border-b border-border bg-muted/30"',
               'className="flex min-w-[820px] items-center gap-4 border-b border-border bg-surface-muted/80 px-6 py-3"')
          once('className="flex items-center gap-4 px-6 py-4 hover:bg-muted/30 transition-colors"',
               'className="flex min-w-[820px] items-center gap-4 px-6 py-4 transition-colors hover:bg-accent/40"')

          text = text.replace('"bg-green-500/20 text-green-500 hover:bg-green-500/30"',
                              '"bg-success/15 text-success hover:bg-success/20"')
          text = text.replace('"bg-red-500/20 text-red-500 hover:bg-red-500/30"',
                              '"bg-destructive/15 text-destructive hover:bg-destructive/20"')
          text = text.replace('"bg-amber-500/20 text-amber-500 hover:bg-amber-500/30"',
                              '"bg-warning/15 text-warning-foreground hover:bg-warning/20"')
          text = text.replace('transaction.type === "receita" ? "text-green-500" : "text-red-500"',
                              'transaction.type === "receita" ? "text-success" : "text-destructive"')

          p.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified transactions refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/transactions/TransactionsPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style: refine transactions responsive layout"
          git push origin HEAD:DEV
