name: Shared visual refactor

on:
  push:
    branches: [DEV]
    paths:
      - .github/workflows/shared-visual-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified visual class replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          base = 'apps/web/src/shared/components/ui'

          replace(f'{base}/avatar.tsx',
              '"relative flex h-10 w-10 shrink-0 overflow-hidden rounded-full"',
              '"relative flex h-10 w-10 shrink-0 overflow-hidden rounded-full border border-border bg-card shadow-sm"')
          replace(f'{base}/avatar.tsx',
              'cn("aspect-square h-full w-full", className)',
              'cn("aspect-square h-full w-full object-cover", className)')
          replace(f'{base}/avatar.tsx',
              '"flex h-full w-full items-center justify-center rounded-full bg-muted"',
              '"flex h-full w-full items-center justify-center rounded-full bg-primary-light text-sm font-semibold text-primary-dark"')

          replace(f'{base}/switch.tsx',
              '"peer inline-flex h-6 w-11 shrink-0 cursor-pointer items-center rounded-full border-2 border-transparent transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background disabled:cursor-not-allowed disabled:opacity-50 data-[state=checked]:bg-primary data-[state=unchecked]:bg-input"',
              '"peer inline-flex h-6 w-11 shrink-0 cursor-pointer items-center rounded-full border border-border bg-input p-0.5 shadow-inner transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background disabled:cursor-not-allowed disabled:opacity-50 data-[state=checked]:border-primary data-[state=checked]:bg-primary data-[state=unchecked]:bg-muted"')
          replace(f'{base}/switch.tsx',
              '"pointer-events-none block h-5 w-5 rounded-full bg-background shadow-lg ring-0 transition-transform data-[state=checked]:translate-x-5 data-[state=unchecked]:translate-x-0"',
              '"pointer-events-none block h-4 w-4 rounded-full bg-card shadow-sm ring-0 transition-transform data-[state=checked]:translate-x-5 data-[state=unchecked]:translate-x-0"')

          replace(f'{base}/separator.tsx', '"shrink-0 bg-border"', '"shrink-0 bg-border/80"')

          replace(f'{base}/table.tsx',
              '<div className="relative w-full overflow-auto">',
              '<div className="relative w-full overflow-auto rounded-xl border border-border bg-card shadow-sm">')
          replace(f'{base}/table.tsx',
              'className={cn("[&_tr]:border-b", className)}',
              'className={cn("bg-surface-muted/80 [&_tr]:border-b", className)}')
          replace(f'{base}/table.tsx',
              '"border-b transition-colors hover:bg-muted/50 data-[state=selected]:bg-muted"',
              '"border-b border-border/80 transition-colors hover:bg-accent/60 data-[state=selected]:bg-accent"')
          replace(f'{base}/table.tsx',
              '"h-12 px-4 text-left align-middle font-medium text-muted-foreground [&:has([role=checkbox])]:pr-0"',
              '"h-11 px-4 text-left align-middle text-xs font-semibold uppercase tracking-wide text-muted-foreground [&:has([role=checkbox])]:pr-0"')
          replace(f'{base}/table.tsx',
              'cn("p-4 align-middle [&:has([role=checkbox])]:pr-0", className)',
              'cn("px-4 py-3.5 align-middle [&:has([role=checkbox])]:pr-0", className)')

          replace(f'{base}/dialog.tsx',
              '"fixed inset-0 z-50 bg-black/80  data-[state=open]:animate-in',
              '"fixed inset-0 z-50 bg-slate-950/45 backdrop-blur-[2px] data-[state=open]:animate-in')
          replace(f'{base}/dialog.tsx',
              '"fixed left-[50%] top-[50%] z-50 grid w-full max-w-lg translate-x-[-50%] translate-y-[-50%] gap-4 border bg-background p-6 shadow-lg duration-200',
              '"fixed left-[50%] top-[50%] z-50 grid w-[calc(100%-2rem)] max-w-lg translate-x-[-50%] translate-y-[-50%] gap-4 rounded-2xl border border-border bg-card p-6 shadow-xl duration-200')
          replace(f'{base}/dialog.tsx',
              '"text-lg font-semibold leading-none tracking-tight"',
              '"text-xl font-semibold leading-none tracking-tight text-foreground"')

          replace(f'{base}/dropdown-menu.tsx',
              '"z-50 min-w-[8rem] overflow-hidden rounded-md border bg-popover p-1 text-popover-foreground shadow-md',
              '"z-50 min-w-[9rem] overflow-hidden rounded-xl border border-border bg-popover p-1.5 text-popover-foreground shadow-lg')
          replace(f'{base}/dropdown-menu.tsx',
              '"relative flex cursor-default select-none items-center rounded-sm px-2 py-1.5 text-sm outline-none transition-colors focus:bg-accent focus:text-accent-foreground data-[disabled]:pointer-events-none data-[disabled]:opacity-50"',
              '"relative flex cursor-default select-none items-center rounded-lg px-2.5 py-2 text-sm outline-none transition-colors focus:bg-accent focus:text-accent-foreground data-[disabled]:pointer-events-none data-[disabled]:opacity-50"')
          replace(f'{base}/dropdown-menu.tsx',
              'className={cn("-mx-1 my-1 h-px bg-muted", className)}',
              'className={cn("-mx-1 my-1 h-px bg-border", className)}')

          replace('apps/web/src/shared/components/KPICard.tsx',
              'iconClassName = "bg-primary/20 text-primary",',
              'iconClassName = "bg-primary-light text-primary-dark",')
          replace('apps/web/src/shared/components/KPICard.tsx',
              '<Card>',
              '<Card className="border-border/80 shadow-sm transition-shadow hover:shadow-md">')
          replace('apps/web/src/shared/components/KPICard.tsx',
              '<CardContent className="p-6">',
              '<CardContent className="p-5">')
          replace('apps/web/src/shared/components/KPICard.tsx',
              '<p className="text-sm text-muted-foreground">{title}</p>',
              '<p className="text-xs font-medium text-muted-foreground">{title}</p>')
          replace('apps/web/src/shared/components/KPICard.tsx',
              'cn("text-2xl font-bold", valueClassName)',
              'cn("mt-2 text-2xl font-bold tracking-tight text-foreground", valueClassName)')
          PY
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified visual refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/shared
          git diff --cached --quiet && exit 0
          git commit -m "style: align shared UI with Clean Flow visual system"
          git push origin HEAD:DEV
