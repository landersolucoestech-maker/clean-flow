name: Three Language I18n Pass

on:
  push:
    branches: [dev]
    paths:
      - ".github/i18n-three-language.trigger"

permissions:
  contents: write

jobs:
  i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply visible-text i18n passes
        run: |
          python scripts/i18n_three_language_pass.py
          python scripts/i18n_fill_parity.py
          python scripts/i18n_replace_catalog_literals.py
          python scripts/i18n_translate_unmatched.py
          python scripts/i18n_replace_catalog_literals.py
      - name: Audit extended presentation strings
        run: python scripts/i18n_extended_audit.py
      - name: Translate and apply attributes, toasts and locales
        run: |
          python scripts/i18n_translate_extended.py
          python scripts/i18n_apply_extended.py
          python scripts/i18n_extended_audit.py
      - name: Install dependencies
        run: npm ci
      - name: Validate full trilanguage coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          base = Path('apps/web/src/app/i18n')
          sets = {}
          for lang in ('en','pt','es'):
              text = (base/f'{lang}.ts').read_text()
              sets[lang] = set(re.findall(r'^\s*"([^"]+)"\s*:', text, flags=re.M))
          all_keys = sets['en'] | sets['pt'] | sets['es']
          for lang in ('en','pt','es'):
              missing = sorted(all_keys - sets[lang])
              if missing:
                  print(lang, 'missing', len(missing), 'keys')
                  sys.exit(1)
          if Path('i18n-unmatched-literals.txt').read_text().strip():
              print('Visible untranslated literals remain')
              sys.exit(1)
          extended = Path('i18n-extended-audit.txt').read_text().strip()
          if extended:
              print('Extended untranslated presentation strings remain:')
              print(extended[:16000])
              sys.exit(1)
          print('PASS:', len(all_keys), 'keys in en/pt/es; visible, attributes, toasts and hardcoded locales = 0')
          PY
      - name: Lint
        run: npx eslint apps/web/src packages --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npx vitest run apps/web/src
      - name: Build
        run: npm run build
      - name: Commit validated trilanguage interface
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src i18n-visible-literals.txt i18n-unmatched-literals.txt i18n-generated-literal-keys.json i18n-generated-presentation-keys.json i18n-extended-audit.txt
          git commit -m "refactor(i18n): complete end-to-end trilanguage interface" || true
          git push origin HEAD:dev
