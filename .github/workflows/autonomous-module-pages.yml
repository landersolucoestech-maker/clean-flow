name: Autonomous Module Pages Migration

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/autonomous-module-pages.yml"

permissions:
  contents: write

concurrency:
  group: autonomous-module-pages-dev
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Move route pages into module page directories
        shell: bash
        run: |
          set -euo pipefail

          move_page() {
            src="$1"
            dst="$2"
            mkdir -p "$(dirname "$dst")"
            git mv "$src" "$dst"
          }

          move_page apps/web/src/modules/billing/BillingPage.tsx apps/web/src/modules/billing/pages/BillingPage.tsx
          move_page apps/web/src/modules/communications/CommunicationsPage.tsx apps/web/src/modules/communications/pages/CommunicationsPage.tsx
          move_page apps/web/src/modules/communications/DialpadCallbackPage.tsx apps/web/src/modules/communications/pages/DialpadCallbackPage.tsx
          move_page apps/web/src/modules/communications/RingCentralCallbackPage.tsx apps/web/src/modules/communications/pages/RingCentralCallbackPage.tsx
          move_page apps/web/src/modules/crm/contacts/ContactsPage.tsx apps/web/src/modules/crm/contacts/pages/ContactsPage.tsx
          move_page apps/web/src/modules/crm/customers/CustomersPage.tsx apps/web/src/modules/crm/customers/pages/CustomersPage.tsx
          move_page apps/web/src/modules/crm/leads/LeadsPage.tsx apps/web/src/modules/crm/leads/pages/LeadsPage.tsx
          move_page apps/web/src/modules/dashboard/Dashboard.tsx apps/web/src/modules/dashboard/pages/Dashboard.tsx
          move_page apps/web/src/modules/payroll/PayrollPage.tsx apps/web/src/modules/payroll/pages/PayrollPage.tsx
          move_page apps/web/src/modules/reports/ReportsPage.tsx apps/web/src/modules/reports/pages/ReportsPage.tsx
          move_page apps/web/src/modules/schedule/SchedulePage.tsx apps/web/src/modules/schedule/pages/SchedulePage.tsx
          move_page apps/web/src/modules/settings/GoogleCallbackPage.tsx apps/web/src/modules/settings/pages/GoogleCallbackPage.tsx
          move_page apps/web/src/modules/settings/SettingsPage.tsx apps/web/src/modules/settings/pages/SettingsPage.tsx
          move_page apps/web/src/modules/settings/SyncLogsPage.tsx apps/web/src/modules/settings/pages/SyncLogsPage.tsx
          move_page apps/web/src/modules/support/SupportPage.tsx apps/web/src/modules/support/pages/SupportPage.tsx
          move_page apps/web/src/modules/transactions/RulesPage.tsx apps/web/src/modules/transactions/pages/RulesPage.tsx
          move_page apps/web/src/modules/transactions/TransactionsPage.tsx apps/web/src/modules/transactions/pages/TransactionsPage.tsx

      - name: Preserve relative import targets after move
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          moved = [
              Path('apps/web/src/modules/billing/pages/BillingPage.tsx'),
              Path('apps/web/src/modules/communications/pages/CommunicationsPage.tsx'),
              Path('apps/web/src/modules/communications/pages/DialpadCallbackPage.tsx'),
              Path('apps/web/src/modules/communications/pages/RingCentralCallbackPage.tsx'),
              Path('apps/web/src/modules/crm/contacts/pages/ContactsPage.tsx'),
              Path('apps/web/src/modules/crm/customers/pages/CustomersPage.tsx'),
              Path('apps/web/src/modules/crm/leads/pages/LeadsPage.tsx'),
              Path('apps/web/src/modules/dashboard/pages/Dashboard.tsx'),
              Path('apps/web/src/modules/payroll/pages/PayrollPage.tsx'),
              Path('apps/web/src/modules/reports/pages/ReportsPage.tsx'),
              Path('apps/web/src/modules/schedule/pages/SchedulePage.tsx'),
              Path('apps/web/src/modules/settings/pages/GoogleCallbackPage.tsx'),
              Path('apps/web/src/modules/settings/pages/SettingsPage.tsx'),
              Path('apps/web/src/modules/settings/pages/SyncLogsPage.tsx'),
              Path('apps/web/src/modules/support/pages/SupportPage.tsx'),
              Path('apps/web/src/modules/transactions/pages/RulesPage.tsx'),
              Path('apps/web/src/modules/transactions/pages/TransactionsPage.tsx'),
          ]

          for path in moved:
              text = path.read_text()
              text = text.replace('from "./', 'from "../')
              text = text.replace("from './", "from '../")
              text = text.replace('import("./', 'import("../')
              text = text.replace("import('./", "import('../")
              path.write_text(text)

          crm_relative_fixes = {
              Path('apps/web/src/modules/crm/contacts/pages/ContactsPage.tsx'): {
                  'from "../components/CrmTabs"': 'from "../../components/CrmTabs"',
                  "from '../components/CrmTabs'": "from '../../components/CrmTabs'",
              },
              Path('apps/web/src/modules/crm/customers/pages/CustomersPage.tsx'): {
                  'from "../components/CrmPageBridge"': 'from "../../components/CrmPageBridge"',
                  "from '../components/CrmPageBridge'": "from '../../components/CrmPageBridge'",
              },
              Path('apps/web/src/modules/crm/leads/pages/LeadsPage.tsx'): {
                  'from "../components/CrmPageBridge"': 'from "../../components/CrmPageBridge"',
                  "from '../components/CrmPageBridge'": "from '../../components/CrmPageBridge'",
              },
          }
          for path, replacements in crm_relative_fixes.items():
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)

          app = Path('apps/web/src/app/App.tsx')
          text = app.read_text()
          replacements = {
              '../modules/crm/customers/CustomersPage': '../modules/crm/customers/pages/CustomersPage',
              '../modules/crm/leads/LeadsPage': '../modules/crm/leads/pages/LeadsPage',
              '../modules/crm/contacts/ContactsPage': '../modules/crm/contacts/pages/ContactsPage',
              '../modules/schedule/SchedulePage': '../modules/schedule/pages/SchedulePage',
              '../modules/billing/BillingPage': '../modules/billing/pages/BillingPage',
              '../modules/transactions/TransactionsPage': '../modules/transactions/pages/TransactionsPage',
              '../modules/communications/CommunicationsPage': '../modules/communications/pages/CommunicationsPage',
              '../modules/transactions/RulesPage': '../modules/transactions/pages/RulesPage',
              '../modules/reports/ReportsPage': '../modules/reports/pages/ReportsPage',
              '../modules/settings/SettingsPage': '../modules/settings/pages/SettingsPage',
              '../modules/support/SupportPage': '../modules/support/pages/SupportPage',
              '../modules/payroll/PayrollPage': '../modules/payroll/pages/PayrollPage',
              '../modules/settings/SyncLogsPage': '../modules/settings/pages/SyncLogsPage',
              '../modules/communications/RingCentralCallbackPage': '../modules/communications/pages/RingCentralCallbackPage',
              '../modules/communications/DialpadCallbackPage': '../modules/communications/pages/DialpadCallbackPage',
              '../modules/settings/GoogleCallbackPage': '../modules/settings/pages/GoogleCallbackPage',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          app.write_text(text)

          home = Path('apps/web/src/app/HomePage.tsx')
          text = home.read_text().replace('../modules/dashboard/Dashboard', '../modules/dashboard/pages/Dashboard')
          home.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend structure and mock boundaries
        run: node scripts/frontend-audit.mjs

      - name: Lint frontend
        run: npx eslint apps/web/src packages --max-warnings=0

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npx vitest run apps/web/src

      - name: Build frontend
        run: npm run build

      - name: Commit validated migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/autonomous-module-pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(web): organize module route pages"
          git push origin HEAD:dev
