name: Workspace Consistency Finish

on:
  push:
    branches: [dev]
    paths:
      - ".github/workspace-consistency.trigger"

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize remaining workspace pages
        run: python .github/scripts/workspace_consistency.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint apps/web/src packages --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vitest run apps/web/src

      - name: Build
        run: npm run build

      - name: Commit validated consistency pass and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workspace-consistency.trigger
          rm -f .github/workflows/workspace-consistency-finish.yml
          rm -f .github/scripts/workspace_consistency.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src .github
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor(web): unify remaining workspace page anatomy"
          git push origin HEAD:dev
