name: Apply Requested UI Fixes

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/apply-requested-ui-fixes.yml"
      - ".github/scripts/apply_requested_ui_fixes.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply scoped layout changes
        run: python3 .github/scripts/apply_requested_ui_fixes.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npx vitest run apps/web/src
      - name: Build
        run: npm run build
      - name: Commit validated changes
        run: |
          rm .github/scripts/apply_requested_ui_fixes.py
          rm .github/workflows/apply-requested-ui-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/schedule/pages/SchedulePage.tsx \
                  apps/web/src/modules/transactions/pages/TransactionsPage.tsx \
                  apps/web/src/modules/crm/customers/pages/CustomersPageContent.tsx \
                  .github/scripts/apply_requested_ui_fixes.py \
                  .github/workflows/apply-requested-ui-fixes.yml
          git commit -m "refactor web page actions and layout tools"
          git push origin HEAD:dev
