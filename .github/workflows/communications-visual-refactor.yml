name: Communications visual refactor

on:
  push:
    branches: [DEV]
    paths:
      - .github/workflows/communications-visual-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refine communications responsive presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/web/src/modules/communications/CommunicationsPage.tsx')
          text = p.read_text(encoding='utf-8')

          def rep(old, new, count=1):
              global text
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old[:180]}')
              text = text.replace(old, new, count)

          rep('''        <main className="flex-1 overflow-y-auto p-6 space-y-6 pl-[10px] pb-0 pr-[10px] pt-px mx-[8px] py-0 my-[4px]">''', '''        <main className="flex-1 overflow-y-auto p-4 sm:p-6">''')
          rep('''          <div className="flex gap-6 h-[calc(100vh-140px)]">''', '''          <div className="flex min-h-[680px] flex-col gap-4 lg:h-[calc(100vh-128px)] lg:min-h-0 lg:flex-row">''')
          rep('''            <div className="w-80 flex flex-col border border-border rounded-lg bg-card">''', '''            <div className="flex w-full flex-col overflow-hidden rounded-2xl border border-border/80 bg-card shadow-sm lg:w-80 lg:shrink-0">''')
          rep('''              <div className="p-4 border-b border-border">''', '''              <div className="border-b border-border/80 p-4">''')
          rep('''                  <h2 className="text-xl font-bold text-foreground">{t("communications.title")}</h2>''', '''                  <h2 className="text-xl font-bold tracking-tight text-foreground">{t("communications.title")}</h2>''')
          rep('''                        className="pl-10 bg-background"''', '''                        className="pl-10"''', 2)
          text = text.replace('text-yellow-500 fill-yellow-500', 'fill-warning text-warning')
          text = text.replace('"bg-primary/10"', '"bg-primary-light"')
          text = text.replace('"hover:bg-muted/50"', '"hover:bg-accent/50"')
          rep('''            <div className="flex-1 flex flex-col border border-border rounded-lg bg-card">''', '''            <div className="flex min-h-[520px] flex-1 flex-col overflow-hidden rounded-2xl border border-border/80 bg-card shadow-sm">''')
          rep('''              <div className="p-4 border-b border-border flex items-center justify-between">''', '''              <div className="flex items-center justify-between border-b border-border/80 p-4">''')
          rep('''                            className={`max-w-[70%] p-3 rounded-lg ${''', '''                            className={`max-w-[85%] rounded-2xl p-3 sm:max-w-[70%] ${''')
          rep('''              <div className="p-4 border-t border-border">''', '''              <div className="border-t border-border/80 bg-card p-3 sm:p-4">''')
          rep('''                      className="pr-16 bg-background"''', '''                      className="pr-16"''')
          rep('''                    className="rounded-full"''', '''                    className="rounded-xl"''')
          rep('''                    variant="hero" \n                    className="flex items-center space-x-2"''', '''                    variant="hero" \n                    className="flex items-center gap-2"''')

          p.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified communications refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/communications/CommunicationsPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style: modernize communications workspace layout"
          git push origin HEAD:DEV
