name: Frontend Audit Fixes

# Retry AppointmentModal contract extraction preserving team options.
on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/frontend-audit-fixes.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/refactor-appointment-modal-types.mjs
      - run: node scripts/frontend-audit.mjs
      - run: npx eslint apps/web/src packages --max-warnings=0
      - run: npm run typecheck
      - run: npx vitest run apps/web/src
      - run: npm run build
      - name: Commit AppointmentModal contract extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/schedule/components/AppointmentModal.tsx apps/web/src/modules/schedule/types/appointmentModal.ts
          git diff --cached --quiet && exit 0
          git commit -m "refactor(frontend): extract appointment modal contracts"
          git push origin HEAD:dev
