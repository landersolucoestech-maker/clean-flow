name: Frontend Audit Fixes

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/frontend-audit-fixes.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Split i18n catalog from provider
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const providerPath = 'apps/web/src/app/providers/LanguageContext.tsx';
          let source = fs.readFileSync(providerPath, 'utf8');
          const declarationStart = source.indexOf('const translations: Record<Language, Record<string, string>> = {\n');
          const providerStart = source.indexOf('\nexport function LanguageProvider');
          if (declarationStart < 0 || providerStart < 0) throw new Error('Language catalog anchors changed');

          const block = source.slice(declarationStart, providerStart);
          const enMarker = '  en: {\n';
          const ptMarker = '  pt: {\n';
          const esMarker = '  es: {\n';
          const enStart = block.indexOf(enMarker);
          const ptStart = block.indexOf(ptMarker);
          const esStart = block.indexOf(esMarker);
          const endMarker = '  },\n};\n';
          const endStart = block.lastIndexOf(endMarker);
          if (enStart < 0 || ptStart < 0 || esStart < 0 || endStart < 0 || !(enStart < ptStart && ptStart < esStart && esStart < endStart)) {
            throw new Error('Translation locale boundaries changed');
          }

          function stripLocaleTerminator(text) {
            if (!text.endsWith('  },\n')) throw new Error('Unexpected locale terminator');
            return text.slice(0, -5);
          }

          const enBody = stripLocaleTerminator(block.slice(enStart + enMarker.length, ptStart));
          const ptBody = stripLocaleTerminator(block.slice(ptStart + ptMarker.length, esStart));
          const esBody = block.slice(esStart + esMarker.length, endStart);

          fs.mkdirSync('apps/web/src/app/i18n', { recursive: true });
          fs.writeFileSync('apps/web/src/app/i18n/en.ts', `export const en = {\n${enBody}} as const;\n`);
          fs.writeFileSync('apps/web/src/app/i18n/pt.ts', `export const pt = {\n${ptBody}} as const;\n`);
          fs.writeFileSync('apps/web/src/app/i18n/es.ts', `export const es = {\n${esBody}} as const;\n`);
          fs.writeFileSync('apps/web/src/app/i18n/translations.ts', `import type { Language } from "../providers/language-context";\nimport { en } from "./en";\nimport { pt } from "./pt";\nimport { es } from "./es";\n\nexport const translations: Record<Language, Record<string, string>> = { en, pt, es };\n`);

          const providerPrefix = source.slice(0, declarationStart);
          const providerTail = source.slice(providerStart + 1);
          const nextSource = providerPrefix.replace(
            'import { LanguageContext, type Language } from "./language-context";\n',
            'import { LanguageContext, type Language } from "./language-context";\nimport { translations } from "../i18n/translations";\n'
          ) + providerTail;
          if (nextSource.includes('const translations:')) throw new Error('Provider still contains translation catalog');
          fs.writeFileSync(providerPath, nextSource);
          NODE
      - run: npx eslint apps/web/src packages --max-warnings=0
      - run: npm run typecheck
      - run: npx vitest run apps/web/src
      - run: npm run build
      - name: Commit i18n split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/providers/LanguageContext.tsx apps/web/src/app/i18n
          git diff --cached --quiet && exit 0
          git commit -m "refactor(frontend): separate i18n data from language provider"
          git push origin HEAD:dev
