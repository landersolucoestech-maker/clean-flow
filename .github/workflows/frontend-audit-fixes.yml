name: Frontend Audit Fixes

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/frontend-audit-fixes.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate full-height pages to PageLayout
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, from, to, label) {
            if (!source.includes(from)) throw new Error(`Missing ${label} anchor`);
            return source.replace(from, to);
          }

          const schedulePath = 'apps/web/src/modules/schedule/SchedulePage.tsx';
          let schedule = fs.readFileSync(schedulePath, 'utf8');
          schedule = replaceOnce(schedule,
            'import { Header } from "@/components/layout/Header";\nimport { Sidebar } from "@/components/layout/Sidebar";',
            'import { PageLayout } from "@/components/layout/PageLayout";',
            'Schedule layout imports');
          schedule = replaceOnce(schedule,
            '  return (\n    <div className="flex h-screen bg-background">\n      <Sidebar />\n\n      <div className="flex-1 flex flex-col overflow-hidden">\n        <Header />\n\n        <main className="flex flex-1 flex-col overflow-hidden px-4 py-5 sm:px-6 lg:px-8 lg:py-7">\n          {/* Page Header */}',
            '  return (\n    <PageLayout fullHeight contentClassName="gap-4">\n      {/* Page Header */}',
            'Schedule shell start');
          schedule = replaceOnce(schedule,
            '        </main>\n      </div>\n\n      {/* Modals */}',
            '      {/* Modals */}',
            'Schedule shell end');
          const scheduleEnd = '\n    </div>\n  );\n}';
          if (!schedule.endsWith(scheduleEnd)) throw new Error('Unexpected Schedule component ending');
          schedule = schedule.slice(0, -scheduleEnd.length) + '\n    </PageLayout>\n  );\n}';
          fs.writeFileSync(schedulePath, schedule);

          const communicationsPath = 'apps/web/src/modules/communications/CommunicationsPage.tsx';
          let communications = fs.readFileSync(communicationsPath, 'utf8');
          communications = replaceOnce(communications,
            'import { Header } from "@/components/layout/Header";\nimport { Sidebar } from "@/components/layout/Sidebar";',
            'import { PageLayout } from "@/components/layout/PageLayout";',
            'Communications layout imports');
          communications = replaceOnce(communications,
            '  return (\n    <div className="flex h-screen bg-background">\n      <Sidebar />\n      \n      <div className="flex-1 flex flex-col overflow-hidden">\n        <Header />\n        \n        <main className="flex-1 overflow-y-auto p-4 sm:p-6">\n          {/* Chat Layout */}\n          <div className="flex min-h-[680px] flex-col gap-4 lg:h-[calc(100vh-128px)] lg:min-h-0 lg:flex-row">',
            '  return (\n    <PageLayout fullHeight contentClassName="gap-4">\n      {/* Chat Layout */}\n      <div className="flex min-h-0 flex-1 flex-col gap-4 lg:flex-row">',
            'Communications shell start');
          communications = replaceOnce(communications,
            '          </div>\n        </main>\n      </div>\n      {/* Broadcast Modal */}',
            '      </div>\n      {/* Broadcast Modal */}',
            'Communications shell end');
          const communicationsEnd = '\n    </div>\n  );\n}';
          if (!communications.endsWith(communicationsEnd)) throw new Error('Unexpected Communications component ending');
          communications = communications.slice(0, -communicationsEnd.length) + '\n    </PageLayout>\n  );\n}';
          fs.writeFileSync(communicationsPath, communications);
          NODE
      - run: npx eslint apps/web/src packages --max-warnings=0
      - run: npm run typecheck
      - run: npx vitest run apps/web/src
      - run: npm run build
      - name: Commit canonical shell migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/schedule/SchedulePage.tsx apps/web/src/modules/communications/CommunicationsPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "refactor(frontend): use canonical full-height page layout"
          git push origin HEAD:dev
