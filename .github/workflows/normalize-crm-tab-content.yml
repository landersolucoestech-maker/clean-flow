name: Normalize CRM Tab Content

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/normalize-crm-tab-content.yml"
      - ".github/scripts/normalize_crm_tab_content.py"

permissions:
  contents: write

jobs:
  normalize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize CRM tabs
        run: python3 .github/scripts/normalize_crm_tab_content.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npx vitest run apps/web/src
      - name: Build
        run: npm run build
      - name: Commit validated CRM normalization
        run: |
          rm .github/scripts/normalize_crm_tab_content.py
          rm .github/workflows/normalize-crm-tab-content.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/crm/leads/pages/LeadsPageContent.tsx \
                  apps/web/src/modules/crm/contacts/pages/ContactsPage.tsx \
                  apps/web/src/modules/crm/customers/pages/CustomersPageContent.tsx \
                  .github/scripts/normalize_crm_tab_content.py \
                  .github/workflows/normalize-crm-tab-content.yml
          git commit -m "normalize CRM tab content layout"
          git pull --rebase origin dev
          git push origin HEAD:dev
