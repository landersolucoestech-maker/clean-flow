name: Maid Flow Frontend Quality

on:
  push:
    branches: [dev]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-quality-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maid-flow-frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, test and build Maid Flow frontend
        run: npm run check
