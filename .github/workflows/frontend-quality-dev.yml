name: Frontend Quality Dev

on:
  push:
    branches: [dev]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/frontend-audit.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-quality-dev.yml"

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce CRM boundaries
        shell: bash
        run: |
          set -euo pipefail

          if [ -d apps/web/src/modules/customers ] || [ -d apps/web/src/modules/leads ]; then
            echo "Customers and Leads must remain under apps/web/src/modules/crm."
            exit 1
          fi

          obsolete_refs=$(grep -RInE '["'"'"'`]\/(customers|leads)(["'"'"'`/?#]|$)' apps/web/src \
            --include='*.ts' --include='*.tsx' \
            --exclude='App.tsx' || true)

          if [ -n "$obsolete_refs" ]; then
            echo "Found obsolete direct CRM routes outside compatibility redirects:"
            echo "$obsolete_refs"
            exit 1
          fi

      - name: Audit frontend structure and mock boundaries
        run: node scripts/frontend-audit.mjs

      - name: Lint frontend
        run: npx eslint apps/web/src packages

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npx vitest run apps/web/src

      - name: Build frontend
        run: npm run build
