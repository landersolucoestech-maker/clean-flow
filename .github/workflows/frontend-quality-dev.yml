name: Frontend Quality Dev

on:
  push:
    branches: [dev]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-quality-dev.yml"

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npx eslint apps/web/src packages

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npx vitest run apps/web/src

      - name: Build frontend
        run: npm run build
