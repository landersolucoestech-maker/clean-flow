name: Settings visual refactor

on:
  push:
    branches: [DEV]
    paths:
      - .github/workflows/settings-visual-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refine settings shell and visual presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/web/src/modules/settings/SettingsPage.tsx')
          text = p.read_text(encoding='utf-8')

          def rep(old, new, count=1):
              global text
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old[:180]}')
              text = text.replace(old, new, count)

          rep('import { Header } from "@/components/layout/Header";\nimport { Sidebar } from "@/components/layout/Sidebar";', 'import { PageLayout } from "@/components/layout/PageLayout";')

          text = text.replace('text-blue-500', 'text-primary')
          text = text.replace('text-amber-500', 'text-warning')
          text = text.replace('bg-emerald-50 text-emerald-700 border-emerald-200', 'border-success/30 bg-success/10 text-success')
          text = text.replace('bg-blue-50 text-blue-700 border-blue-200', 'border-primary/30 bg-primary-light text-primary-dark')
          text = text.replace('bg-amber-50 text-amber-700 border-amber-200', 'border-warning/30 bg-warning/10 text-warning-foreground')
          text = text.replace('bg-primary/10 flex items-center justify-center', 'bg-primary-light flex items-center justify-center')

          rep('''  return (\n    <div className="flex h-screen bg-background">\n      <Sidebar />\n      <div className="flex-1 flex flex-col overflow-hidden">\n        <Header />\n        <main className="flex-1 overflow-y-auto p-6 space-y-6">\n          <div className="space-y-6">''', '''  return (\n    <PageLayout>\n          <div className="space-y-6">''')
          rep('''              <h1 className="text-3xl font-bold text-foreground">{t("settings.title")}</h1>''', '''              <h1 className="text-2xl font-bold tracking-tight text-foreground sm:text-3xl">{t("settings.title")}</h1>''')
          rep('''            <div className="flex items-center gap-2 border-b border-border pb-4 overflow-x-auto">''', '''            <div className="flex items-center gap-2 overflow-x-auto border-b border-border/80 pb-4">''')
          rep('''                    className={`flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium transition-colors whitespace-nowrap ${\n                      isActive\n                        ? "bg-foreground text-background"\n                        : "bg-muted text-muted-foreground hover:bg-muted/80"\n                    }`}''', '''                    className={`flex items-center gap-2 whitespace-nowrap rounded-xl px-4 py-2 text-sm font-medium transition-colors ${\n                      isActive\n                        ? "bg-primary text-primary-foreground shadow-sm"\n                        : "bg-muted/70 text-muted-foreground hover:bg-accent hover:text-foreground"\n                    }`}''')

          rep('''          </div>\n        </main>\n      </div>\n\n      <TeamUserModal''', '''          </div>\n\n      <TeamUserModal''')
          rep('''      />\n    </div>\n  );''', '''      />\n    </PageLayout>\n  );''')

          rep('''          <div className="flex gap-4 flex-wrap">''', '''          <div className="flex flex-col gap-3 lg:flex-row lg:flex-wrap">''')
          rep('''            <div className="flex-1 min-w-[200px]">''', '''            <div className="min-w-0 flex-1">''')
          rep('''              <SelectTrigger className="w-44">''', '''              <SelectTrigger className="w-full lg:w-44">''')
          rep('''                <div key={staff.id} className="flex items-center justify-between p-4 border border-border rounded-lg">''', '''                <div key={staff.id} className="flex flex-col gap-4 rounded-xl border border-border/80 bg-card p-4 transition-colors hover:bg-accent/30 sm:flex-row sm:items-center sm:justify-between">''')
          rep('''                  <div className="flex items-center gap-3">''', '''                  <div className="flex min-w-0 items-center gap-3">''')
          rep('''                  <div className="flex items-center gap-3">''', '''                  <div className="flex flex-wrap items-center gap-2 sm:justify-end">''', 1)

          p.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified settings refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/settings/SettingsPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style: modernize settings page shell and layout"
          git push origin HEAD:DEV
