name: Residual UI audit 2

on:
  push:
    branches: [DEV]
    paths:
      - .github/workflows/ui-residual-audit-2.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV
      - name: Audit remaining non-deliberate UI inconsistencies
        run: |
          echo '=== NON-DELIBERATE HEADER/SIDEBAR IMPORTS ==='
          grep -RIl --include='*.tsx' -E '@/components/layout/(Header|Sidebar)' apps/web/src/modules | grep -v 'communications/CommunicationsPage.tsx' | grep -v 'schedule/SchedulePage.tsx' || true
          echo '=== ARBITRARY LEGACY SPACING ==='
          grep -RIn --include='*.tsx' -E 'pl-\[10px\]|pr-\[10px\]|mx-\[8px\]|my-\[4px\]' apps/web/src/modules || true
          echo '=== LEGACY PAGE TITLES ==='
          grep -RIn --include='*.tsx' 'text-3xl font-bold text-foreground' apps/web/src/modules || true
          echo '=== NONRESPONSIVE FIVE COLUMN GRIDS ==='
          grep -RIn --include='*.tsx' -E 'className="grid grid-cols-5|className="grid grid-cols-2 md:grid-cols-5' apps/web/src/modules || true
          echo '=== NON-DELIBERATE HARDCODED PALETTE ==='
          grep -RIn --include='*.tsx' -E '(bg|text|border|fill)-(blue|green|red|yellow|orange|purple|cyan|indigo|emerald|gray)-[0-9]{2,3}' apps/web/src/modules \
            | grep -v 'schedule/calendar/CalendarGrid.tsx' \
            | grep -v 'reports/components/AIConsultantCard.tsx' \
            | grep -v 'admin/pages/AdminAuth.tsx' \
            | head -300 || true
