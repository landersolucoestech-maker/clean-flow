name: Dashboard visual refactor

on:
  push:
    branches: [DEV]
    paths:
      - .github/workflows/dashboard-visual-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refine dashboard panels
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]}')
              text = text.replace(old, new) if count is None else text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          recent = 'apps/web/src/modules/dashboard/components/RecentActivity.tsx'
          upcoming = 'apps/web/src/modules/dashboard/components/UpcomingJobs.tsx'

          replace(recent,
              'className="transition-all duration-200 hover:shadow-lg"',
              'className="border-border/80 shadow-sm transition-shadow hover:shadow-md"')
          replace(recent,
              '<CardHeader>',
              '<CardHeader className="pb-3">')
          replace(recent,
              'className="text-lg font-semibold"',
              'className="text-base font-semibold tracking-tight"')
          replace(recent,
              '<CardContent className="space-y-4">',
              '<CardContent className="space-y-3">')
          replace(recent,
              'className="flex items-start space-x-3"',
              'className="flex items-start gap-3 rounded-xl border border-transparent p-2.5 transition-colors hover:border-border hover:bg-accent/40"')
          replace(recent,
              'className={`p-2 rounded-lg bg-surface-muted ${activity.color}`}',
              'className={`flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-primary-light ${activity.color}`}')
          replace(recent,
              'className="text-xs"',
              'className="text-[11px]"')
          replace(recent,
              'className="flex items-center justify-center gap-1 pt-4 border-t border-border"',
              'className="flex items-center justify-center gap-1 border-t border-border/80 pt-4"')

          replace(upcoming,
              'className="transition-all duration-200 hover:shadow-lg"',
              'className="border-border/80 shadow-sm transition-shadow hover:shadow-md"')
          replace(upcoming,
              'className="flex flex-row items-center justify-between"',
              'className="flex flex-row items-center justify-between gap-3 pb-3"')
          replace(upcoming,
              'className="text-lg font-semibold"',
              'className="text-base font-semibold tracking-tight"')
          replace(upcoming,
              '<CardContent className="space-y-4">',
              '<CardContent className="space-y-3">')
          replace(upcoming,
              'className="flex items-center justify-between p-4 bg-surface-muted rounded-lg hover:bg-accent transition-colors"',
              'className="flex items-center justify-between gap-4 rounded-xl border border-border/70 bg-card p-4 shadow-sm transition-colors hover:bg-accent/40"')
          replace(upcoming,
              'className="flex items-center gap-1 px-1.5 py-0.5 bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 rounded text-xs"',
              'className="flex items-center gap-1 rounded-full bg-warning/15 px-2 py-0.5 text-xs font-medium text-warning-foreground"')
          replace(upcoming,
              'className="text-xs ml-2 flex-shrink-0"',
              'className="ml-2 flex-shrink-0 text-[11px]"')
          replace(upcoming,
              'className="space-y-1 text-sm text-muted-foreground"',
              'className="space-y-1.5 text-sm text-muted-foreground"')
          replace(upcoming,
              'className="flex items-center justify-center gap-1 pt-4 border-t border-border"',
              'className="flex items-center justify-center gap-1 border-t border-border/80 pt-4"')
          PY
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified dashboard refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules/dashboard
          git diff --cached --quiet && exit 0
          git commit -m "style: refine dashboard activity and jobs panels"
          git push origin HEAD:DEV
