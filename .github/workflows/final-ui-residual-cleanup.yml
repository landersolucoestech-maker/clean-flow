name: Final UI residual cleanup

on:
  push:
    branches: [DEV]
    paths:
      - .github/workflows/final-ui-residual-cleanup.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean final operational UI residues
        run: |
          python - <<'PY'
          from pathlib import Path

          def update(path_str, replacements):
              p = Path(path_str)
              text = p.read_text(encoding='utf-8')
              before = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text == before:
                  print(f'no changes: {path_str}')
              else:
                  p.write_text(text, encoding='utf-8')
                  print(f'updated: {path_str}')

          update('apps/web/src/modules/reports/components/AnalyticsTab.tsx', [
            ('return "bg-green-500";', 'return "bg-success";'),
            ('return "bg-blue-500";', 'return "bg-primary";'),
            ('return "bg-yellow-500";', 'return "bg-warning";'),
            ('return "bg-red-500";', 'return "bg-destructive";'),
          ])

          update('apps/web/src/modules/settings/components/AuditTab.tsx', [
            ('className="text-xs bg-warning/10 text-warning-foreground dark:bg-orange-900/30 dark:text-orange-400"', 'className="bg-warning/10 text-xs text-warning-foreground"'),
          ])

          update('apps/web/src/modules/support/components/TicketDetailsModal.tsx', [
            ('"bg-primary-light text-blue-800 dark:bg-blue-900 dark:text-blue-200"', '"bg-primary-light text-primary-dark"'),
            ('"bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200"', '"bg-warning/10 text-warning-foreground"'),
            ('"bg-warning/10 text-orange-800 dark:bg-orange-900 dark:text-orange-200"', '"bg-warning/15 text-warning-foreground"'),
            ('"bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200"', '"bg-success/10 text-success"'),
            ('"bg-muted text-foreground dark:bg-gray-900 dark:text-gray-200"', '"bg-muted text-muted-foreground"'),
            ('"bg-primary-light text-blue-800"', '"bg-primary-light text-primary-dark"'),
            ('"bg-warning/10 text-orange-800"', '"bg-warning/10 text-warning-foreground"'),
            ('"bg-red-100 text-red-800"', '"bg-destructive/10 text-destructive"'),
          ])

          # Schedule status colors are operational states; team-number colors remain deliberately distinct.
          for path_str in [
            'apps/web/src/modules/schedule/components/AppointmentModal.tsx',
            'apps/web/src/modules/schedule/components/AppointmentDetailsView.tsx',
          ]:
              update(path_str, [
                ('bg-emerald-500/10 text-emerald-600 border-emerald-500/20', 'bg-success/10 text-success border-success/20'),
                ('bg-blue-500/10 text-blue-600 border-blue-500/20', 'bg-primary-light text-primary-dark border-primary/20'),
                ('bg-red-500/10 text-red-600 border-red-500/20', 'bg-destructive/10 text-destructive border-destructive/20'),
              ])

          update('apps/web/src/modules/schedule/components/JobStatusTracker.tsx', [
            ('border-green-500 bg-green-50 dark:bg-green-950/20', 'border-success bg-success/5'),
            ('text-green-500', 'text-success'),
          ])

          update('apps/web/src/modules/jobs/components/JobDetailsModal.tsx', [
            ('className="sm:max-w-[550px] max-h-[90vh] overflow-y-auto"', 'className="max-h-[90vh] overflow-y-auto sm:max-w-[550px]"'),
            ('<div className="flex items-center gap-4">', '<div className="flex items-start gap-3 sm:items-center sm:gap-4">'),
            ('<div className="w-14 h-14 rounded-full bg-primary/10 flex items-center justify-center">', '<div className="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-primary-light sm:h-14 sm:w-14">'),
            ('<div className="grid grid-cols-2 gap-4">', '<div className="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4">'),
            ('<DialogFooter className="flex gap-2 mt-4">', '<DialogFooter className="mt-4 flex flex-col gap-2 sm:flex-row">'),
          ])
          PY
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified final UI cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/modules
          git diff --cached --quiet && exit 0
          git commit -m "style: finish operational UI semantic and responsive cleanup"
          git push origin HEAD:DEV
